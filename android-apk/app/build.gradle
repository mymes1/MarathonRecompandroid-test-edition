def buildAsLibrary = project.hasProperty('BUILD_AS_LIBRARY');
def buildAsApplication = !buildAsLibrary
if (buildAsApplication) {
    apply plugin: 'com.android.application'
}
else {
    apply plugin: 'com.android.library'
}

android {
    if (buildAsApplication) {
        namespace "org.libsdl.app"
    }
    compileSdkVersion 35
    ndkVersion "29.0.14206865"
    defaultConfig {
        // Java sources and JNI bindings stay in the org.libsdl.app namespace (SDL
        // registers natives against those class names); only the install identity
        // changes. Renaming this orphans data under Android/data/<old id>.
        applicationId "com.sega.marathon"
        minSdkVersion 29
        targetSdkVersion 35
        versionCode 5
        versionName "1.0.4"
    }
    // CI provides the release keystore through environment variables (see
    // .github/workflows/android.yml); local release builds stay unsigned.
    if (System.getenv("ANDROID_KEYSTORE_FILE") != null) {
        signingConfigs {
            ci {
                storeFile file(System.getenv("ANDROID_KEYSTORE_FILE"))
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (System.getenv("ANDROID_KEYSTORE_FILE") != null) {
                signingConfig signingConfigs.ci
            }
        }
    }
    // MarathonRecomp's libmain.so is built separately by the project's own CMake pipeline
    // (see the android-release preset and build scripts) and copied into
    // src/main/jniLibs/arm64-v8a/ manually; there is intentionally no Gradle ndk-build step.
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
    lint {
        abortOnError false
    }

    if (buildAsLibrary) {
        libraryVariants.all { variant ->
            variant.outputs.each { output ->
                def outputFile = output.outputFile
                if (outputFile != null && outputFile.name.endsWith(".aar")) {
                    def fileName = "org.libsdl.app.aar";
                    output.outputFile = new File(outputFile.parent, fileName);
                }
            }
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}

if (buildAsApplication) {
    tasks.register("validateNativePayload") {
        doLast {
            def abiDir = file("src/main/jniLibs/arm64-v8a")
            def requiredLibs = [
                "libmain.so",
                "libmain_hook.so",
                "libfile_redirect_hook.so",
                "libgsl_alloc_hook.so",
                "libhook_impl.so"
            ]

            requiredLibs.each { libName ->
                def lib = new File(abiDir, libName)
                if (!lib.isFile()) {
                    throw new GradleException("Missing native library ${lib}. Run ../../build_android_apk_replit.sh or ../../build_apk.sh so a freshly built arm64-v8a payload is staged before Gradle packaging.")
                }

                def header = new byte[64]
                def bytesRead = 0
                lib.withInputStream { stream ->
                    bytesRead = stream.read(header)
                }
                if (bytesRead < 4 || (header[0] & 0xFF) != 0x7F || (header[1] & 0xFF) != 0x45 || (header[2] & 0xFF) != 0x4C || (header[3] & 0xFF) != 0x46) {
                    def prefix = new String(header, 0, Math.max(bytesRead, 0), "UTF-8")
                    if (prefix.startsWith("version https://git-lfs.github.com/spec/")) {
                        throw new GradleException("${lib} is a Git LFS pointer, not an Android ELF library. Rebuild/copy libmain.so before assembling the APK.")
                    }
                    throw new GradleException("${lib} is not an Android ELF library. Rebuild/copy the native payload before assembling the APK.")
                }
            }
        }
    }

    tasks.matching { it.name == "preBuild" }.configureEach {
        dependsOn("validateNativePayload")
    }
}
